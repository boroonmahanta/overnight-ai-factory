# yaml-language-server: $schema=../../../../scenario.schema.json
#
# Example locked workflow scenario, on Microsoft's Northwind Traders sample
# solution (decision D6), as `AI-Business-Solutions/ai-factory-nwt` holds it.
# It tests behaviour Northwind already has, so it passes on an unchanged import
# (DG9). AC-1 is a stand-in: the spec that maps this ID is written with 2539.
#
# What Northwind does: its classic workflow "Sample Data Load Order Option Sets"
# runs in the background when an order is created. It reads the order's text
# column nwind_sampledataorderstatus and sets the choice nwind_orderstatusid:
# "Shipped" sets 2 (the choice nwind_ordersstatus: 0 New, 1 Invoiced,
# 2 Shipped, 3 Closed). Read from src/Workflows/ and src/OptionSets/ there.
schema_version: 1
id: wf-order-status-shipped-01
kind: workflow
title: "A new order with the sample-data status Shipped is given the order status Shipped"
criteria: [AC-1]
timeout_seconds: 300
poll_seconds: 10
seed:
  - alias: customer
    table: nwind_customers
    tag_column: nwind_sampledataoriginalid
    fields:
      nwind_company: "Scenario test customer"
trigger:
  kind: row
  action: create
  alias: order
  table: nwind_orders
  tag_column: nwind_sampledataoriginalid
  fields:
    nwind_customerid:
      ref: customer
    nwind_orderdate: "${today}"
    nwind_sampledataorderstatus: "Shipped"
expect:
  rows:
    - ref: order
      fields:
        nwind_orderstatusid:
          equals: 2
  # Secondary signal only. This workflow deletes its own succeeded jobs
  # (AsyncAutodelete), so the run record is usually gone and comes back
  # unknown, which never decides the case. A failed job left behind fails it.
  run:
    workflow_id: "6f739d13-1686-448d-9eb5-9c27a247cb52"
    status: succeeded
