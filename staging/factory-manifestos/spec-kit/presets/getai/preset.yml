schema_version: "1.0"

preset:
  id: "getai"
  name: "GET AI"
  version: "0.1.0"
  description: "GET AI day gate for every profile: story fields, the acceptance scenario map, NFR and Constraints sections, grilling rules in specify and clarify, the GET AI constitution and checklist."
  author: "GET AI"
  license: "Proprietary"

requires:
  speckit_version: ">=1.4.3,<1.5"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Story fields before the core spec; acceptance scenario map, NFRs and Constraints after it"
      strategy: "wrap"

    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "The GET AI constitution"

    - type: "template"
      name: "getai-checklist"
      file: "templates/getai-checklist.md"
      description: "Reviewer-owned GET AI checklist, written into every spec's checklists folder"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "GET AI rules around core specify: facts versus decisions, no marker cap, AC IDs, story fields"
      strategy: "wrap"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "GET AI grilling rules around core clarify: rounds of up to five, facts versus decisions, terms, decision records, confirmation gate"
      strategy: "wrap"

tags:
  - "getai"
  - "governance"
  - "day-gate"
