schema_version: "1.0"

bundle:
  id: getai-lcp
  name: GET AI low-code day gate
  version: 0.1.0
  role: low-code spec owner
  description: The GET AI and getai-lcp presets, the GET AI spec check and Spec Kit's assess and bug extensions, for low-code project repos.
  author: GET AI
  license: Proprietary

requires:
  speckit_version: ">=1.4.3,<1.5"
  tools:
    - python3

# Spec Kit 1.4.3 resolves bundle components only from its packaged set or from a
# catalog; it never installs a preset or extension from a folder beside this file.
# assess and bug are packaged. The three GET AI components need the private "getai"
# catalog, made when this folder moves to GetAI-IP/factory-manifestos (DG8). Until
# then, install them with --dev (see ../../README.md).
#
# The lean preset is left out on purpose: its implement command has no hook step and
# no checklist gate, so it would skip the mandatory spec check.
#
# A preset's priority decides precedence (lower wins), so getai-lcp composes on top of
# getai. "strategy" here is recorded bundle metadata; each contribution's own strategy
# is set in its preset.yml.
provides:
  extensions:
    - id: assess
      version: 1.0.2
    - id: bug
      version: 1.0.2
    - id: getai-spec-check
      version: 0.1.0
      source: getai
  presets:
    - id: getai-lcp
      version: 0.1.0
      priority: 5
      strategy: append
      source: getai
    - id: getai
      version: 0.1.0
      priority: 10
      strategy: wrap
      source: getai

tags:
  - getai
  - low-code
  - day-gate
